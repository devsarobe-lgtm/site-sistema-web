{% extends 'base_site.html' %}
{% load static %}

{% block styles %}
<link rel="stylesheet" href="{% static 'css/error_pages.css' %}">
{% endblock %}

{% block content %}
<section class="error-page py-5">
    <div class="container">
        <div class="row justify-content-center text-center">
            <div class="col-lg-7" data-aos="fade-up">
                <div class="error-card p-4 p-md-5">
                    <div class="error-icon mb-3">
                        <i class="bi bi-shield-lock"></i>
                    </div>

                    <p class="error-code mb-2">403</p>
                    <h1 class="error-title mb-3">Acesso negado</h1>
                    <p class="error-text mb-4">
                        Você não tem permissão para acessar este conteúdo.
                    </p>

                    <div class="d-flex gap-2 justify-content-center flex-wrap">
                        <a class="btn btn-primary" href="{% url 'home' %}">
                            <i class="bi bi-house-door me-2"></i>Início
                        </a>
                        <a class="btn btn-outline-secondary" href="{% url 'contact' %}">
                            <i class="bi bi-envelope me-2"></i>Falar com a Sarobe
                        </a>
                    </div>
                </div>

                <p class="error-subtle mt-3 mb-0">
                    Se isso for um engano, entre em contato com a equipe.
                </p>
            </div>
        </div>
    </div>
</section>
{% endblock %}
