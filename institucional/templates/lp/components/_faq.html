{% if lp_faq.items %}
<section class="lp-faq" id="perguntas-frequentes" aria-labelledby="lp-faq-title" data-lp-faq>
    <div class="container">
        <div class="row g-4 g-lg-5 align-items-start">
            <div class="col-12 col-lg-5">
                <div class="lp-faq__intro">
                    <p class="lp-eyebrow lp-faq__eyebrow">{{ lp_faq.eyebrow }}</p>
                    <h2 id="lp-faq-title">{{ lp_faq.title }}</h2>
                    <p class="lp-faq__description">{{ lp_faq.description }}</p>
                    <span class="lp-faq__divider" aria-hidden="true"></span>
                    <p class="lp-faq__support">{{ lp_faq.support_text }}</p>
                    <a class="lp-button lp-faq__contact" href="{{ lp_whatsapp_url|default:'https://wa.me/554832660069' }}"
                        target="_blank" rel="noopener noreferrer"
                        aria-label="{{ lp_faq.cta_label }} pelo WhatsApp (abre em nova aba)">
                        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" focusable="false">
                            <path d="M13.601 2.326A7.85 7.85 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.9 7.9 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.9 7.9 0 0 0 13.6 2.326zM7.994 14.521a6.6 6.6 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.56 6.56 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592m3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.007-.247-.007-.38-.007a.73.73 0 0 0-.529.247c-.182.198-.691.677-.691 1.654s.71 1.916.81 2.049c.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232"/>
                        </svg>
                        <span>{{ lp_faq.cta_label }}</span>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                            <path d="M5 12h14m-6-6 6 6-6 6"/>
                        </svg>
                    </a>
                </div>
            </div>

            <div class="col-12 col-lg-7">
                <ol class="lp-faq__items">
                    {% for item in lp_faq.items %}
                    <li>
                        <details class="lp-faq__item" name="lp-faq"{% if forloop.first %} open{% endif %}>
                            <summary class="lp-faq__question">
                                <span class="lp-faq__number" aria-hidden="true">0{{ forloop.counter }}</span>
                                <span class="lp-faq__question-text">{{ item.question }}</span>
                                <svg class="lp-faq__chevron" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" aria-hidden="true" focusable="false">
                                    <path d="m6 9 6 6 6-6"/>
                                </svg>
                            </summary>
                            <div class="lp-faq__answer"><p>{{ item.answer }}</p></div>
                        </details>
                    </li>
                    {% endfor %}
                </ol>
            </div>
        </div>
    </div>
</section>
{% endif %}
