{% load static %}
<header class="lp-header{% if not lp_hero %} lp-header--solid{% endif %}" id="lp-header">
    <div class="container lp-header__inner">
        <a class="lp-header__brand" href="{% if lp_hero %}#{{ lp_hero.id|default:'inicio' }}{% else %}{% url 'home' %}{% endif %}" data-lp-scroll
            aria-label="{% if lp_hero %}Sarobe Contabilidade — voltar ao início da página{% else %}Sarobe Contabilidade — ir para a página inicial{% endif %}">
            <picture>
                <source type="image/webp" srcset="{% static 'img/logos/logo_branca_icon_sem_fundo.webp' %} 1x, {% static 'img/logos/logo_branca_icon_sem_fundo_2x.webp' %} 2x">
                <img src="{% static 'img/logos/logo_branca_icon_sem_fundo.webp' %}" alt="" width="50" height="50" loading="eager" decoding="async">
            </picture>
            <span class="lp-header__brand-text">
                <strong>Sarobe</strong>
                <small>Contabilidade</small>
            </span>
        </a>

        <button class="lp-header__toggle" type="button" aria-controls="lp-navigation" aria-expanded="false"
            aria-label="Abrir menu" data-lp-menu-toggle>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" aria-hidden="true" focusable="false">
                <path d="M4 7h16M4 12h16M4 17h16"/>
            </svg>
        </button>

        <nav class="lp-header__nav" id="lp-navigation" aria-label="Navegação da página" data-lp-navigation>
            <ul class="lp-header__links">
                {% for item in lp_nav_items %}
                <li><a href="{{ item.url }}" data-lp-scroll{% if item.active %} aria-current="location"{% endif %}>{{ item.label }}</a></li>
                {% endfor %}
            </ul>
            {% if lp_whatsapp_url %}
            <a class="lp-button lp-header__contact" href="{{ lp_whatsapp_url }}" target="_blank" rel="noopener noreferrer"
                aria-label="{{ lp_header_contact_label|default:'Fale com a Sarobe' }} pelo WhatsApp (abre em nova aba)">
                <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" focusable="false">
                    <path d="M13.601 2.326A7.85 7.85 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.9 7.9 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.9 7.9 0 0 0 13.6 2.326zM7.994 14.521a6.6 6.6 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.56 6.56 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592m3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.007-.247-.007-.38-.007a.73.73 0 0 0-.529.247c-.182.198-.691.677-.691 1.654s.71 1.916.81 2.049c.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232"/>
                </svg>
                <span>{{ lp_header_contact_label|default:'WhatsApp' }}</span>
            </a>
            {% endif %}
        </nav>
    </div>
</header>
