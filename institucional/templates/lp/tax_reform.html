{% extends 'lp/lp_base.html' %}

{% block info %}
<title>{{ lp_meta_title }}</title>
<meta name="description" content="{{ lp_meta_description }}">
<meta property="og:type" content="website">
<meta property="og:locale" content="pt_BR">
<meta property="og:site_name" content="Sarobe Contabilidade">
<meta property="og:title" content="{{ lp_meta_title }}">
<meta property="og:description" content="{{ lp_meta_description }}">
<meta property="og:url" content="{{ request.scheme }}://{{ request.get_host }}{{ request.path }}">
{% endblock %}

{% block content %}
<section class="lp-intro" id="inicio" tabindex="-1" aria-labelledby="lp-intro-title">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-12 col-md-8 col-lg-7">
                <p class="lp-eyebrow">{{ lp_hero.eyebrow }}</p>
                <h1 id="lp-intro-title">{{ lp_hero.title }}</h1>
                <p class="lp-intro__description">{{ lp_hero.description }}</p>
                <a class="lp-button" href="{{ lp_hero.primary_url }}" target="_blank" rel="noopener noreferrer">{{ lp_hero.primary_label }}</a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
