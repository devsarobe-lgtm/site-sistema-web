{% load static %}

<header class="main-header">
    <nav class="navbar navbar-expand-md navbar-dark">
        <div class="container">
            <!-- Logo -->
            <a href="{% url 'home' %}" class="navbar-brand d-flex align-items-center site-logo">

                <picture>
                    <source type="image/webp" srcset="
                        {% static 'img/logos/logo_branca_icon_sem_fundo.webp' %} 1x,
                        {% static 'img/logos/logo_branca_icon_sem_fundo@2x.webp' %} 2x
                    ">
                    <img src="{% static 'img/logos/logo_branca_icon_sem_fundo.webp' %}" alt="" aria-hidden="true"
                        class="logo-img" loading="eager" fetchpriority="high" decoding="async" width="50" height="50">
                </picture>

                <div class="d-flex flex-column lh-sm brand-text text-white ms-2">
                    <span class="fw-bold text-uppercase">Sarobe</span>
                    <span class="sub-brand">Contabilidade</span>
                </div>
            </a>

            <!-- Botão hamburguer (mobile) -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar"
                aria-controls="mainNavbar" aria-expanded="false" aria-label="Abrir menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Menu (desktop + mobile) -->
            <div class="collapse navbar-collapse justify-content-end text-center" id="mainNavbar">
                {% with current=request.resolver_match.url_name %}
                <ul class="navbar-nav align-items-md-center gap-md-3">
                    <li class="nav-item">
                        <a href="{% url 'home' %}"
                            class="nav-link nav-link-header {% if current == 'home' %}active{% endif %}"
                            aria-current="{% if current == 'home' %}page{% endif %}">
                            Home
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="{% url 'about' %}"
                            class="nav-link nav-link-header {% if current == 'about' %}active{% endif %}"
                            aria-current="{% if current == 'about' %}page{% endif %}">
                            Sobre
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="{% url 'services' %}"
                            class="nav-link nav-link-header {% if current == 'services' %}active{% endif %}"
                            data-scroll-target="services">
                            Serviços
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="{% url 'plans' %}"
                            class="nav-link nav-link-header {% if current == 'plans' %}active{% endif %}">
                            Planos
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="{% url 'blog' %}"
                            class="nav-link nav-link-header {% if current == 'blog' %}active{% endif %}">
                            Atualizações
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="{% url 'contact' %}"
                            class="nav-link nav-link-header {% if current == 'contact' %}active{% endif %}">
                            Contato
                        </a>
                    </li>
                    <li class="nav-item mt-3 mt-md-0 w-100 w-md-auto">
                        <a href="https://wa.me/5548988263060?text=Ol%C3%A1%21%20Gostaria%20de%20mais%20informa%C3%A7%C3%B5es%2C%20por%20favor."
                            target="_blank" rel="noopener noreferrer"
                            class="btn btn-outline-warning btn-whatsapp d-inline-flex align-items-center justify-content-center mx-auto">
                            <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="currentColor"
                                class="bi bi-telephone me-2 icon-svg" viewBox="0 0 16 16">
                                <path
                                    d="M3.654 1.328a.678.678 0 0 0-1.015-.063L1.605 2.3c-.483.484-.661 1.169-.45 1.77a17.6 17.6 0 0 0 4.168 6.608 17.6 17.6 0 0 0 6.608 4.168c.601.211 1.286.033 1.77-.45l1.034-1.034a.678.678 0 0 0-.063-1.015l-2.307-1.794a.68.68 0 0 0-.58-.122l-2.19.547a1.75 1.75 0 0 1-1.657-.459L5.482 8.062a1.75 1.75 0 0 1-.46-1.657l.548-2.19a.68.68 0 0 0-.122-.58zM1.884.511a1.745 1.745 0 0 1 2.612.163L6.29 2.98c.329.423.445.974.315 1.494l-.547 2.19a.68.68 0 0 0 .178.643l2.457 2.457a.68.68 0 0 0 .644.178l2.189-.547a1.75 1.75 0 0 1 1.494.315l2.306 1.794c.829.645.905 1.87.163 2.611l-1.034 1.034c-.74.74-1.846 1.065-2.877.702a18.6 18.6 0 0 1-7.01-4.42 18.6 18.6 0 0 1-4.42-7.009c-.362-1.03-.037-2.137.703-2.877z" />
                            </svg> WhatsApp
                        </a>
                    </li>
                </ul>
                {% endwith %}

            </div>
        </div>
    </nav>
</header>
